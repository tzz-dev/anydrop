name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SIGNAL_URL: wss://signal.example.com

      - name: Bundle worker (dry run)
        run: pnpm --filter worker exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
